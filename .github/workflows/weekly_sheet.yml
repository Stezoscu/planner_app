name: Generate Next Week's Google Sheet

on:
  schedule:
    # Runs every Sunday at 21:00 UTC (22:00 UK winter / 23:00 summer)
    - cron: "0 21 * * SUN"
  workflow_dispatch:  # allows manual trigger in GitHub Actions UI

jobs:
  generate-next-week:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly Google Sheet generation
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          echo "$GOOGLE_SHEETS_CREDENTIALS" > credentials.json
          python app/generate_next_week.py
